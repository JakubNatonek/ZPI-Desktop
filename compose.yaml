services:
  backend:
    build:
      context: ./ZPI-Desktop-Backend
      dockerfile: Dockerfile
    container_name: zpi-desktop-backend
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./ZPI-Desktop-App
      dockerfile: Dockerfile
    container_name: zpi-desktop-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
