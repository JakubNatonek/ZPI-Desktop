services:
  db:
    image: postgres:16-alpine
    container_name: zpi-desktop-db
    environment:
      POSTGRES_DB: zpidb
      POSTGRES_USER: userzpi
      POSTGRES_PASSWORD: userzpi#
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userzpi -d zpidb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./ZPI-Desktop-Backend
      dockerfile: Dockerfile
    container_name: zpi-desktop-backend
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://userzpi:userzpi%23@db:5432/zpidb
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./ZPI-Desktop-App
      dockerfile: Dockerfile
    container_name: zpi-desktop-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
